name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Build all platform binaries + web assets
        run: bun scripts/build-binary.ts --all-platforms

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist/projectflows-linux-x64
            dist/projectflows-linux-arm64
            dist/projectflows-darwin-x64
            dist/projectflows-darwin-arm64
            dist/projectflows-windows-x64.exe
            dist/web.tar.gz
