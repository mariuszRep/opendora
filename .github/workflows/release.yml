name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  # ── Job 1: compile all platform binaries + tarballs ─────────────────────────
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Build all platform binaries + web + core
        run: bun scripts/build-binary.ts --all-platforms

      - name: Build release manifest + OTA web bundle
        run: bun scripts/build-release-manifest.ts --tag ${{ github.ref_name || inputs.tag }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 2: Tauri Windows installer (.msi + NSIS .exe) ───────────────────────
  build-windows-installer:
    runs-on: windows-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install desktop dependencies
        run: bun install
        working-directory: apps/desktop

      - name: Prepare sidecar + resources and build Tauri
        run: bun scripts/build-desktop.ts --skip-binary

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 1

  # ── Job 3: create GitHub Release with all artifacts ─────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-binaries, build-windows-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: windows-installer/

      - name: Validate release assets
        run: >
          bun scripts/validate-release-assets.ts
          --manifest dist/release-manifest.json
          --tag ${{ github.ref_name || inputs.tag }}
          --assets-dir dist
          --assets-dir windows-installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist/projectflows-linux-x64
            dist/projectflows-linux-arm64
            dist/projectflows-darwin-x64
            dist/projectflows-darwin-arm64
            dist/projectflows-windows-x64.exe
            dist/web.tar.gz
            dist/core.tar.gz
            dist/dist.zip
            dist/release-manifest.json
            windows-installer/*.exe
            windows-installer/*.msi
