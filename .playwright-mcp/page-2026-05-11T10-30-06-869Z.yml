        - heading "AI agents that show their work" [level=2] [ref=e39]
        - paragraph [ref=e40]: Traditional AI agents are opaque — you send a prompt, get a response, and have no visibility into how it happened. OpenDora changes that by making every step of every agentic workflow transparent and replayable.
        - paragraph [ref=e41]: Whether you are debugging a complex pipeline, auditing AI decisions for compliance, or collaborating with non-technical teammates on workflow design, OpenDora gives you the visibility you need without sacrificing usability.
