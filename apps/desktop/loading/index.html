<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projectflows</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #root { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; }
    .logo { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.8rem; color: rgba(255,255,255,0.4); }
    .error { font-size: 0.8rem; color: #f87171; }
    #retry { margin-top: 8px; padding: 6px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.8rem; display: none; }
    #retry:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="root">
    <div class="logo">Projectflows</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Starting server…</div>
    <div class="error" id="error" style="display:none"></div>
    <button id="retry">Retry</button>
  </div>
  <script>
    const STATUS_URL = "http://localhost:4097/health";
    const MAX_WAIT_MS = 30000;
    const POLL_INTERVAL_MS = 500;

    let elapsed = 0;

    async function poll() {
      try {
        const r = await fetch(STATUS_URL, { signal: AbortSignal.timeout(2000) });
        if (r.ok || r.status < 500) {
          // Server is up — ask Rust to navigate the webview
          const { invoke } = window.__TAURI_INTERNALS__;
          await invoke("navigate_to_app");
          return;
        }
      } catch {}

      elapsed += POLL_INTERVAL_MS;
      if (elapsed >= MAX_WAIT_MS) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").style.display = "none";
        document.getElementById("error").style.display = "";
        document.getElementById("error").textContent = "Server failed to start within 30 s. Check logs.";
        document.getElementById("retry").style.display = "";
        const { invoke } = window.__TAURI_INTERNALS__;
        invoke("show_window").catch(() => {});
        return;
      }

      const secs = Math.floor(elapsed / 1000);
      if (secs > 2) {
        document.getElementById("status").textContent = `Starting server… (${secs}s)`;
      }
      setTimeout(poll, POLL_INTERVAL_MS);
    }

    document.getElementById("retry").addEventListener("click", () => {
      elapsed = 0;
      document.getElementById("spinner").style.display = "";
      document.getElementById("status").style.display = "";
      document.getElementById("error").style.display = "none";
      document.getElementById("retry").style.display = "none";
      document.getElementById("status").textContent = "Retrying…";
      poll();
    });

    poll();
  </script>
</body>
</html>
