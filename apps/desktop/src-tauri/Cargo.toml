[package]
name = "projectflows-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "projectflows_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
flate2 = "1"
tar = "0.4"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
